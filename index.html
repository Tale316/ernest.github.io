<!DOCTYPE html>
<html>
<head>
<title>Valentine Question</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(45deg, #ffccd5, #ffe6f0, #ffd6e0);
    background-size: 300% 300%;
    animation: sparkle 8s infinite alternate;
    margin: 20px;
    overflow-x: hidden;
}

@keyframes sparkle {
    from { background-position: left; }
    to { background-position: right; }
}

h1 {
    font-size: 32px;
    color: #ff1a75;
    min-height: 60px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #ff4d4d;
    color: white;
}

#celebration {
    display: none;
    font-size: 24px;
    margin-top: 25px;
    color: #cc0066;
}

.dog {
    width: 80%;
    max-width: 250px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.heart {
    position: fixed;
    color: red;
    animation: floatUp 5s linear forwards;
    font-size: 20px;
    z-index: 999;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<audio id="bgMusic" src="https://discordapp.com/channels/@me/1174443993770237994/1469259438975352905"></audio>

<img id="dogGif" class="dog" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif">

<div id="interaction-box">
    <h1 id="typingText"></h1>
    <div id="buttonContainer">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<div id="celebration">
    ❤️ You just made me the happiest man on earth ❤️
    <br><br>
    <a href="https://open.spotify.com/playlist/0WHVUllIT4VNIQer0QKCFG?si=8XhvCu8NSn2sAdlVRRky1QKCFG" target="_blank" style="text-decoration: none; color: #1DB954; font-weight: bold;">
        Terry, click here for our mixtape 🎵
    </a>
</div>

<script>
/* 1. Typing Animation Logic */
let text = "Tsuma, will you be my Valentine? 💖";
let typingElement = document.getElementById("typingText");
let index = 0;

function typeText() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 60);
    }
}
typeText();

/* 2. Button and Display Logic */
let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let interactionBox = document.getElementById("interaction-box");
let celebration = document.getElementById("celebration");
let bgMusic = document.getElementById("bgMusic");

let noMessages = [
    "Are you sure?",
    "Really sure?",
    "Please reconsider 😢",
    "Don't do this to me",
    "I baked cookies...",
    "Last chance 🥺",
    "You're breaking my heart 💔"
];

let noClickCount = 0;
let yesSize = 18;

noBtn.onclick = function() {
    if (noClickCount < noMessages.length) {
        noBtn.innerText = noMessages[noClickCount];
    }
    noClickCount++;
    yesSize += 10;
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = (yesSize) + "px " + (yesSize * 1.5) + "px";
};

yesBtn.onclick = function() {
    interactionBox.style.display = "none";
    celebration.style.display = "block";

    // Start Audio
    bgMusic.play().catch(error => {
        console.log("Audio play failed: ", error);
    });

    createConfetti();
    startHearts();
};

/* 3. Visual Effects */
function createConfetti() {
    for (let i = 0; i < 100; i++) {
        let confetti = document.createElement("div");
        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.backgroundColor = "hsl(" + Math.random() * 360 + ", 100%, 50%)";
        confetti.style.animation = "floatUp 4s linear forwards";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
    }
}

function startHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
}

document.body.addEventListener("dblclick", () => {
    alert("Secret unlocked: You are loved more than you know 💕");
});
</script>

</body>
</html>
