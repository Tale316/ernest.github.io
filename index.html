<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        margin-top: 40px;
    }

    img {
        max-width: 90%;
        height: auto;
        border-radius: 12px;
    }

    h1 {
        margin-top: 20px;
        font-size: 28px;
    }

    .buttons {
        margin-top: 20px;
    }

    button {
        padding: 12px 25px;
        margin: 10px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4da6;
        color: white;
    }

    #noBtn {
        background-color: gray;
        color: white;
        position: relative;
    }

    button:hover {
        transform: scale(1.1);
    }

    .bottom-link {
        position: fixed;
        bottom: 10px;
        width: 100%;
        font-size: 14px;
        opacity: 0.6;
    }

    .bottom-link a {
        color: #ff4da6;
        text-decoration: none;
    }
</style>
</head>

<body>

<div class="container">

    <!-- GIF stays visible -->
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute GIF">

    <!-- This whole section disappears after YES -->
    <div id="valentineSection">
        <h1>Tsuma, will you be my Valentine?</h1>

        <div class="buttons">
            <button id="yesBtn">Yes ❤️</button>
            <button id="noBtn">No 😢</button>
        </div>
    </div>

</div>

<!-- Bottom secret link -->
<div class="bottom-link">
    <a href="https://example.com" target="_blank">Click here</a>
</div>

<script>

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const valentineSection = document.getElementById("valentineSection");

    // YES button hides message and buttons
    yesBtn.addEventListener("click", () => {
        valentineSection.style.display = "none";
        alert("You just made someone very happy ❤️");
    });

    // NO button runs away (fun effect)
    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * window.innerWidth * 0.6;
        const y = Math.random() * window.innerHeight * 0.6;

        noBtn.style.position = "absolute";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

</script>

</body>
</html>
