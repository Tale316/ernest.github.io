<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-gradient: linear-gradient(135deg, #ffccd5, #ffe6f0, #ffd6e0);
        --card-bg: rgba(255, 255, 255, 0.65);
        --card-border: rgba(255, 255, 255, 0.9);
        --card-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
        --text-main: #4a4a4a;
        --text-highlight: #ff1a75;
        --btn-yes-bg: #4CAF50;
        --btn-no-bg: #ff4d4d;
        --gold-gradient: linear-gradient(to bottom, #B8860B 0%, #d4af37 50%, #8B4513 100%);
        --music-btn-bg: rgba(255, 255, 255, 0.9);
        --modal-bg: #fff0f5;
        --modal-text: #cc0066;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg-gradient: linear-gradient(135deg, #2c001e, #59002b, #1a0010);
            --card-bg: rgba(30, 0, 10, 0.6);
            --card-border: rgba(255, 105, 180, 0.3);
            --card-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            --text-main: #f0f0f0;
            --text-highlight: #ff6699;
            --btn-yes-bg: #00cc66;
            --btn-no-bg: #ff3333;
            --gold-gradient: linear-gradient(to bottom, #ffd700 0%, #ffec8b 50%, #cd853f 100%);
            --music-btn-bg: rgba(50, 0, 20, 0.9);
            --modal-bg: #2d0a15;
            --modal-text: #ff99cc;
        }
    }

    body {
        font-family: 'Nunito', sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 5vh; 
        min-height: 100vh;
        background: var(--bg-gradient);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        margin: 0;
        overflow-y: auto; 
        overflow-x: hidden;
        touch-action: manipulation; 
        color: var(--text-main);
        transition: background 0.5s ease;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes floatCard {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    .main-card {
        background: var(--card-bg); 
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 40px 30px;
        border-radius: 35px;
        box-shadow: var(--card-shadow);
        border: 2px solid var(--card-border);
        display: inline-block; 
        width: 85%;
        max-width: 420px;
        text-align: center;
        position: relative;
        z-index: 10;
        margin-bottom: 100px;
        animation: floatCard 6s ease-in-out infinite;
        transition: all 0.5s ease;
    }

    .golden-melody {
        font-family: 'Great Vibes', cursive;
        background: var(--gold-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.15));
        line-height: 1.2;
    }

    h1 { font-size: 48px; min-height: 90px; margin: 20px 0; }

    button {
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        margin: 10px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    #yesBtn { background-color: var(--btn-yes-bg); color: white; animation: pulseHeart 2s infinite; }

    @keyframes pulseHeart {
        0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(76, 175, 80, 0); }
        100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }

    #noBtn { background-color: var(--btn-no-bg); color: white; }

    #celebration { display: none; font-size: 28px; margin-top: 25px; opacity: 0; transition: opacity 1.5s ease-in; }

    .mixtape-link {
        text-decoration: none; font-size: 20px; font-weight: bold;
        animation: colorChange 3s infinite; display: block; margin-top: 25px;
        padding: 10px; background: rgba(255,255,255,0.1); border-radius: 15px;
    }

    @keyframes colorChange {
        0%, 100% { color: var(--text-highlight); }
        50% { color: #1DB954; }
    }

    #musicToggleBtn {
        display: none; position: fixed; bottom: 25px; left: 50%;
        transform: translateX(-50%); padding: 12px 25px; font-size: 14px;
        background-color: var(--music-btn-bg); color: var(--text-main);
        border: 2px solid #B8860B; border-radius: 50px; z-index: 1000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(5px);
    }

    .dog { width: 100%; max-width: 240px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

    .modal {
        display: none; position: fixed; z-index: 2000; left: 0; top: 0;
        width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
    }

    .modal-content {
        background-color: var(--modal-bg); margin: 25% auto; padding: 30px;
        border: 2px solid var(--text-highlight); border-radius: 25px; width: 80%; max-width: 320px;
        text-align: center; color: var(--modal-text); font-size: 26px; font-family: 'Great Vibes', cursive;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4); position: relative;
    }

    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 28px; cursor: pointer; font-family: sans-serif; color: var(--text-main); opacity: 0.7; }

    .confetti { position: fixed; pointer-events: none; z-index: 15; }
    .heart { position: fixed; color: #ff1a75; animation: floatUp 5s linear forwards; z-index: 5; text-shadow: 0 0 5px rgba(255,26,117,0.5); }

    @keyframes floatUp {
        from { transform: translateY(110vh) scale(0.5); opacity: 1; }
        to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
</style>
</head>

<body>

<audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.discordapp.com/attachments/1174443993770237994/1469259438983479398/Taylor_Swift_-_Enchanted_Taylors_Version.m4a?ex=698701fb&is=6985b07b&hm=c5fde5202b77597d334f5a1dd698daa0b15634f2353b76495af534574f89d3ed&" type="audio/mp4">
</audio>

<button id="musicToggleBtn">Stop Music 🔇</button>

<div id="easterEggModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">×</span>
        <p>Easter egg found : <br> I Love you more than you realize ❤️</p>
    </div>
</div>

<div class="main-card">
    <img id="dogGif" class="dog" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Cute Dog">
    <div id="interaction-box">
        <h1 id="typingText" class="golden-melody"></h1>
        <div id="buttonContainer">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>
    <div id="celebration">
        <div class="golden-melody" style="font-size: 36px;">❤️ You just made me the happiest man on earth ❤️</div>
        <a href="https://open.spotify.com/playlist/0WHVUllIT4VNIQer0QKCFG?si=8XhvCu8NSn2sAdlVRRky1QKCFG" id="spotifyLink" target="_blank" class="mixtape-link">
            Terry, click <span style="text-decoration: underline;">here</span> for our mixtape 🎵
        </a>
    </div>
</div>

<script>
let noTaps = 0;
let eggTriggered = "No";
let spotifyClicked = "No";
let startTime = Date.now();
let celebrationStartTime = null;
let timeToMixtape = "N/A";
let dataSent = false; 
let trackingTimeout = null; 

let text = "Tsuma, will you be my Valentine? 💖";
let typingElement = document.getElementById("typingText");
let index = 0;
function typeText() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 60);
    }
}
typeText();

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const interactionBox = document.getElementById("interaction-box");
const celebration = document.getElementById("celebration");
const bgMusic = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggleBtn");
const spotifyLink = document.getElementById("spotifyLink");

let noMessages = ["Are you sure?", "Really sure?", "Please reconsider 😢", "Don't do this to me", "Last chance 🥺", "You're breaking my heart 💔"];
let yesSize = 18;

noBtn.onclick = () => {
    noTaps++;
    if (noTaps <= noMessages.length) noBtn.innerText = noMessages[noTaps - 1];
    yesSize += 15;
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = `${yesSize}px ${yesSize * 1.2}px`;
};

// FIX FOR CHROME MOBILE AUDIO
yesBtn.onclick = () => {
    // 1. "Prime" the audio immediately on user click (Crucial for Chrome)
    bgMusic.play().then(() => {
        // Audio started successfully, we keep it playing
    }).catch(e => {
        console.log("Autoplay prevented, will retry in celebration block");
    });

    const rect = yesBtn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2 + window.scrollX;
    const centerY = rect.top + rect.height / 2 + window.scrollY;

    interactionBox.style.display = "none";
    celebrationStartTime = Date.now();

    trackingTimeout = setTimeout(() => {
        sendData("Valentine Accepted (20s Timeout reached)");
    }, 20000); 

    setTimeout(() => {
        celebration.style.display = "block";
        setTimeout(() => { celebration.style.opacity = "1"; }, 50);
        toggleBtn.style.display = "block"; 
        
        // 2. Double-check audio is playing
        if (bgMusic.paused) {
            bgMusic.play().catch(() => {
                // If it STILL fails, change button text to alert user
                toggleBtn.innerText = "Play Music 🎵";
            });
        }
        
        fireConfetti(centerX, centerY);
        startHearts();
    }, 800);
};

spotifyLink.onclick = () => {
    spotifyClicked = "Yes";
    if (celebrationStartTime) {
        timeToMixtape = ((Date.now() - celebrationStartTime) / 1000).toFixed(2);
    }
    clearTimeout(trackingTimeout);
    sendData("Valentine Accepted - Spotify Clicked!");
};

window.addEventListener("beforeunload", () => {
    if (celebrationStartTime && !dataSent) {
        sendData("User Closed Tab after Yes (Emergency Send)");
    }
});

toggleBtn.onclick = () => {
    if (bgMusic.paused) {
        bgMusic.play();
        toggleBtn.innerText = "Stop Music 🔇";
    } else {
        bgMusic.pause();
        toggleBtn.innerText = "Play Music 🎵";
    }
};

function sendData(customMessage) {
    if (dataSent) return; 
    dataSent = true; 
    let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
    const payload = JSON.stringify({
            status: customMessage,
            no_clicks: noTaps,
            easter_egg_found: eggTriggered,
            spotify_link_pressed: spotifyClicked,
            total_seconds_to_yes: finalTime,
            seconds_after_yes_until_mixtape: timeToMixtape,
            recipient_email: "ernest.c.mutale@gmail.com"
        });
    fetch("https://formspree.io/f/mwvnedow", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: payload,
        keepalive: true 
    });
}

function fireConfetti(startX, startY) {
    const count = 150;
    const particles = [];
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'confetti';
        p.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`; 
        p.style.width = Math.random() * 8 + 4 + 'px';
        p.style.height = Math.random() * 8 + 4 + 'px';
        document.body.appendChild(p);
        particles.push({
            el: p, x: startX, y: startY,
            vX: (Math.random() - 0.5) * 30, vY: (Math.random() - 1.2) * 25,
            gravity: 0.6, drag: 0.96, rotation: Math.random() * 360, vR: Math.random() * 10 - 5
        });
    }
    function update() {
        particles.forEach((p, i) => {
            p.vY += p.gravity; p.vX *= p.drag; p.vY *= p.drag;
            p.x += p.vX; p.y += p.vY; p.rotation += p.vR;
            p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rotation}deg)`;
            if (p.y > window.innerHeight + window.scrollY + 100) { p.el.remove(); particles.splice(i, 1); }
        });
        if (particles.length > 0) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px"; 
        heart.style.opacity = Math.random() * 0.5 + 0.5;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
}

const modal = document.getElementById("easterEggModal");
const closeBtn = document.querySelector(".close-btn");
document.body.addEventListener("dblclick", () => {
    modal.style.display = "block";
    eggTriggered = "Yes"; 
});
closeBtn.onclick = () => modal.style.display = "none";
</script>

</body>
</html>
