<!DOCTYPE html>
<html>
<head>
<title>Valentine Question</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* Body acts as the background/centering environment */
body {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(45deg, #ffccd5, #ffe6f0, #ffd6e0);
    background-size: 300% 300%;
    animation: sparkle 8s infinite alternate;
    margin: 0;
    overflow-x: hidden;
}

@keyframes sparkle {
    from { background-position: left; }
    to { background-position: right; }
}

/* The Main Container (The Card) */
.main-card {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px); /* Modern glassmorphism effect */
    padding: 40px;
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.8);
    display: inline-block; /* Crucial: allows container to grow with content */
    max-width: 90%;
    text-align: center;
    transition: all 0.3s ease; /* Smooth growing animation */
}

.golden-melody {
    font-family: 'Great Vibes', cursive;
    background: linear-gradient(to bottom, #cfac48 0%, #ffecb3 22%, #cfac48 50%, #85610d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
    font-weight: normal;
}

h1 {
    font-size: 45px;
    min-height: 80px;
    margin-top: 20px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    white-space: nowrap; /* Prevents button text from wrapping as it grows */
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #ff4d4d;
    color: white;
}

#celebration {
    display: none;
    font-size: 30px;
    margin-top: 25px;
}

@keyframes colorChange {
    0% { color: #ff1a75; }
    33% { color: #1DB954; }
    66% { color: #007bff; }
    100% { color: #ff1a75; }
}

.mixtape-link {
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    animation: colorChange 3s infinite;
}

.underline-text {
    text-decoration: underline;
}

#musicToggleBtn {
    display: none; 
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 12px 18px;
    font-size: 14px;
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
    border: 2px solid #cfac48;
    border-radius: 50px;
    z-index: 1000;
}

.dog {
    width: 100%;
    max-width: 250px;
    border-radius: 20px;
}

.heart {
    position: fixed;
    color: red;
    animation: floatUp 5s linear forwards;
    font-size: 20px;
    z-index: 999;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.discordapp.com/attachments/1174443993770237994/1469259438983479398/Taylor_Swift_-_Enchanted_Taylors_Version.m4a?ex=698701fb&is=6985b07b&hm=c5fde5202b77597d334f5a1dd698daa0b15634f2353b76495af534574f89d3ed&" type="audio/mp4">
</audio>

<button id="musicToggleBtn">Stop Music 🔇</button>

<div class="main-card">
    
    <img id="dogGif" class="dog" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif">

    <div id="interaction-box">
        <h1 id="typingText" class="golden-melody"></h1>
        <div id="buttonContainer">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="celebration">
        <div class="golden-melody">❤️ You just made me the happiest man on earth ❤️</div>
        <br>
        <a href="https://open.spotify.com/playlist/0WHVUllIT4VNIQer0QKCFG?si=8XhvCu8NSn2sAdlVRRky1QKCFG" target="_blank" class="mixtape-link">
            Terry, click <span class="underline-text">here</span> for our mixtape 🎵
        </a>
    </div>

</div>

<script>
let text = "Tsuma, will you be my Valentine? 💖";
let typingElement = document.getElementById("typingText");
let index = 0;

function typeText() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 60);
    }
}
typeText();

let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let interactionBox = document.getElementById("interaction-box");
let celebration = document.getElementById("celebration");
let bgMusic = document.getElementById("bgMusic");
let toggleBtn = document.getElementById("musicToggleBtn");

let noMessages = ["Are you sure?", "Really sure?", "Please reconsider 😢", "Don't do this to me", "Last chance 🥺", "You're breaking my heart 💔"];
let noClickCount = 0;
let yesSize = 18;

noBtn.onclick = function() {
    if (noClickCount < noMessages.length) {
        noBtn.innerText = noMessages[noClickCount];
    }
    noClickCount++;
    yesSize += 12; // Adjusted growth for better container scaling
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = (yesSize) + "px " + (yesSize * 1.2) + "px";
};

yesBtn.onclick = function() {
    interactionBox.style.display = "none";
    celebration.style.display = "block";
    toggleBtn.style.display = "block"; 

    bgMusic.play().catch(e => console.log("Playback blocked:", e));

    createConfetti();
    startHearts();
};

toggleBtn.onclick = function() {
    if (bgMusic.paused) {
        bgMusic.play();
        toggleBtn.innerText = "Stop Music 🔇";
    } else {
        bgMusic.pause();
        toggleBtn.innerText = "Play Music 🎵";
    }
};

function createConfetti() {
    for (let i = 0; i < 100; i++) {
        let confetti = document.createElement("div");
        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.backgroundColor = "hsl(" + Math.random() * 360 + ", 100%, 50%)";
        confetti.style.animation = "floatUp 4s linear forwards";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
    }
}

function startHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
}
</script>

</body>
</html>
