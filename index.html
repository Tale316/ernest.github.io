<!DOCTYPE html>
<html>
<head>
<title>Valentine Question</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(45deg, #ffccd5, #ffe6f0, #ffd6e0);
    background-size: 300% 300%;
    animation: sparkle 8s infinite alternate;
    margin: 20px;
}

@keyframes sparkle {
    from { background-position: left; }
    to { background-position: right; }
}

h1 {
    font-size: 32px;
    color: #ff1a75;
    min-height: 60px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #ff4d4d;
    color: white;
}

#celebration {
    display: none;
    font-size: 24px;
    margin-top: 25px;
    color: #cc0066;
}

.dog {
    width: 80%;
    max-width: 250px;
    border-radius: 20px;
}

.heart {
    position: fixed;
    color: red;
    animation: floatUp 5s linear forwards;
    font-size: 20px;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}

</style>
</head>

<body>

<img class="dog" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif">

<h1 id="typingText"></h1>

<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>

<div id="celebration">

❤️ You just made me the happiest man on earth ❤️
<br><br>

<a href="https://open.spotify.com/playlist/0WHVUllIT4VNIQer0QKCFG?si=8XhvCu8NSn2sAdlVRRky1QKCFG" target="_blank">
Terry, click here for our mixtape 🎵
</a>

<br><br>

<div id="musicContainer"></div>

</div>

<script>

/* Typing Animation */

let text = "Tsuma, will you be my Valentine? 💖";
let typingElement = document.getElementById("typingText");
let index = 0;

function typeText() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 60);
    }
}
typeText();

/* Buttons */

let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let celebration = document.getElementById("celebration");
let musicContainer = document.getElementById("musicContainer");

let noMessages = [
    "Are you sure?",
    "Really sure?",
    "Please reconsider 😢",
    "Don't do this to me",
    "I baked cookies...",
    "Last chance 🥺",
    "You're breaking my heart 💔"
];

let noClickCount = 0;
let yesSize = 18;

noBtn.onclick = function() {

    if (noClickCount < noMessages.length) {
        noBtn.innerText = noMessages[noClickCount];
    }

    noClickCount++;

    yesSize += 8;
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = (yesSize) + "px " + (yesSize * 1.5) + "px";
};

yesBtn.onclick = function() {

    celebration.style.display = "block";

    createConfetti();
    startHearts();

    /* Dynamically create music player */
    musicContainer.innerHTML = `
        <musicContainer.innerHTML = `
    <iframe width="300" height="170"
    src="https://www.youtube.com/embed/Zm61zM5R0Ss?autoplay=1"
    allow="autoplay; encrypted-media"
    allowfullscreen>
    </iframe>
`;

    `;
};

/* Confetti */

function createConfetti() {

    for (let i = 0; i < 100; i++) {

        let confetti = document.createElement("div");
        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.backgroundColor =
            "hsl(" + Math.random() * 360 + ", 100%, 50%)";

        confetti.style.animation = "floatUp 4s linear forwards";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 4000);
    }
}

/* Floating Hearts */

function startHearts() {

    setInterval(() => {

        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);

    }, 400);
}

/* Easter Egg */

document.body.addEventListener("dblclick", () => {
    alert("Secret unlocked: You are loved more than you know 💕");
});

</script>

</body>
</html>
