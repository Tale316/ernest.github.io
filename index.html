<!DOCTYPE html>
<html>
<head>
<title>Valentine Question</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(45deg, #ffccd5, #ffe6f0, #ffd6e0);
    background-size: 300% 300%;
    animation: sparkle 8s infinite alternate;
    margin: 20px;
    overflow-x: hidden;
}

@keyframes sparkle {
    from { background-position: left; }
    to { background-position: right; }
}

h1 {
    font-size: 32px;
    color: #ff1a75;
    min-height: 60px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background-color: #4CAF50;
    color: white;
}

#noBtn {
    background-color: #ff4d4d;
    color: white;
}

#celebration {
    display: none;
    font-size: 24px;
    margin-top: 25px;
    color: #cc0066;
}

@keyframes colorChange {
    0% { color: #ff1a75; }
    33% { color: #1DB954; }
    66% { color: #007bff; }
    100% { color: #ff1a75; }
}

.mixtape-link {
    text-decoration: none;
    font-weight: bold;
    animation: colorChange 3s infinite;
}

.underline-text {
    text-decoration: underline;
}

/* Fixed Toggle Button for Mobile */
#musicToggleBtn {
    display: none; 
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 12px 18px;
    font-size: 14px;
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
    border: 2px solid #ff1a75;
    border-radius: 50px;
    z-index: 1000;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
}

.dog {
    width: 80%;
    max-width: 250px;
    border-radius: 20px;
    margin-bottom: 20px;
}

.heart {
    position: fixed;
    color: red;
    animation: floatUp 5s linear forwards;
    font-size: 20px;
    z-index: 999;
}

@keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.discordapp.com/attachments/1174443993770237994/1469259438983479398/Taylor_Swift_-_Enchanted_Taylors_Version.m4a?ex=698701fb&is=6985b07b&hm=c5fde5202b77597d334f5a1dd698daa0b15634f2353b76495af534574f89d3ed&" type="audio/mp4">
</audio>

<button id="musicToggleBtn">Stop Music 🔇</button>

<img id="dogGif" class="dog" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif">

<div id="interaction-box">
    <h1 id="typingText"></h1>
    <div id="buttonContainer">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>
</div>

<div id="celebration">
    ❤️ You just made me the happiest man on earth ❤️
    <br><br>
    <a href="https://open.spotify.com/playlist/0WHVUllIT4VNIQer0QKCFG?si=8XhvCu8NSn2sAdlVRRky1QKCFG" target="_blank" class="mixtape-link">
        Terry, click <span class="underline-text">here</span> for our mixtape 🎵
    </a>
</div>

<script>
/* 1. Typing Logic */
let text = "Tsuma, will you be my Valentine? 💖";
let typingElement = document.getElementById("typingText");
let index = 0;

function typeText() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 60);
    }
}
typeText();

/* 2. Global Variables */
let yesBtn = document.getElementById("yesBtn");
let noBtn = document.getElementById("noBtn");
let interactionBox = document.getElementById("interaction-box");
let celebration = document.getElementById("celebration");
let bgMusic = document.getElementById("bgMusic");
let toggleBtn = document.getElementById("musicToggleBtn");

let noMessages = ["Are you sure?", "Really sure?", "Please reconsider 😢", "Don't do this to me", "Last chance 🥺", "You're breaking my heart 💔"];
let noClickCount = 0;
let yesSize = 18;

/* 3. Button Behaviors */
noBtn.onclick = function() {
    if (noClickCount < noMessages.length) {
        noBtn.innerText = noMessages[noClickCount];
    }
    noClickCount++;
    yesSize += 10;
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = (yesSize) + "px " + (yesSize * 1.5) + "px";
};

yesBtn.onclick = function() {
    interactionBox.style.display = "none";
    celebration.style.display = "block";
    toggleBtn.style.display = "block"; 

    bgMusic.play().catch(e => console.log("Playback blocked:", e));

    createConfetti();
    startHearts();
};

/* 4. The Toggle Mechanism */
toggleBtn.onclick = function() {
    if (bgMusic.paused) {
        bgMusic.play();
        toggleBtn.innerText = "Stop Music 🔇";
        toggleBtn.style.backgroundColor = "rgba(255, 255, 255, 0.9)";
    } else {
        bgMusic.pause();
        toggleBtn.innerText = "Play Music 🎵";
        toggleBtn.style.backgroundColor = "#ffccd5"; // Slight color change when paused
    }
};

/* 5. Effects */
function createConfetti() {
    for (let i = 0; i < 100; i++) {
        let confetti = document.createElement("div");
        confetti.style.position = "fixed";
        confetti.style.width = "8px";
        confetti.style.height = "8px";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = "-10px";
        confetti.style.backgroundColor = "hsl(" + Math.random() * 360 + ", 100%, 50%)";
        confetti.style.animation = "floatUp 4s linear forwards";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
    }
}

function startHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
}
</script>

</body>
</html>
