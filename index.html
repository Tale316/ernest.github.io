<!DOCTYPE html>
<html>
<head>
<title>Valentine Question</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 10vh; 
    min-height: 100vh;
    background: linear-gradient(45deg, #ffccd5, #ffe6f0, #ffd6e0);
    background-size: 300% 300%;
    animation: sparkle 8s infinite alternate;
    margin: 0;
    overflow: hidden;
    touch-action: manipulation; 
}

@keyframes sparkle {
    from { background-position: left; }
    to { background-position: right; }
}

.main-card {
    background: rgba(255, 255, 255, 0.7); 
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.8);
    display: inline-block; 
    max-width: 85%;
    text-align: center;
    position: relative;
    z-index: 10;
}

.golden-melody {
    font-family: 'Great Vibes', cursive;
    background: linear-gradient(to bottom, #B8860B 0%, #D4AF37 50%, #8B4513 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.2));
}

h1 { font-size: 42px; min-height: 80px; margin-top: 10px; }

button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn { background-color: #4CAF50; color: white; }
#noBtn { background-color: #ff4d4d; color: white; }

#celebration { 
    display: none; 
    font-size: 30px; 
    margin-top: 25px;
    opacity: 0;
    transition: opacity 1.5s ease-in;
}

.mixtape-link {
    text-decoration: none; font-size: 18px; font-weight: bold;
    animation: colorChange 3s infinite; display: block; margin-top: 20px;
}

@keyframes colorChange {
    0%, 100% { color: #ff1a75; }
    50% { color: #1DB954; }
}

#musicToggleBtn {
    display: none; position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 18px; font-size: 14px; background-color: rgba(255, 255, 255, 0.9);
    border: 2px solid #B8860B; border-radius: 50px; z-index: 1000;
}

.dog { width: 100%; max-width: 220px; border-radius: 20px; }

.modal {
    display: none; position: fixed; z-index: 2000; left: 0; top: 0;
    width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background-color: #fff0f5; margin: 20% auto; padding: 30px;
    border: 3px solid #ff1a75; border-radius: 20px; width: 80%; max-width: 300px;
    text-align: center; color: #cc0066; font-size: 24px; font-family: 'Great Vibes', cursive;
}

.close-btn { float: right; font-size: 28px; cursor: pointer; font-family: sans-serif; }
.confetti { position: fixed; pointer-events: none; z-index: 15; }
.heart { position: fixed; color: red; animation: floatUp 5s linear forwards; z-index: 5; }

@keyframes floatUp {
    from { transform: translateY(110vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.discordapp.com/attachments/1174443993770237994/1469259438983479398/Taylor_Swift_-_Enchanted_Taylors_Version.m4a?ex=698701fb&is=6985b07b&hm=c5fde5202b77597d334f5a1dd698daa0b15634f2353b76495af534574f89d3ed&" type="audio/mp4">
</audio>

<button id="musicToggleBtn">Stop Music 🔇</button>

<div id="easterEggModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">×</span>
        <p>Easter egg found : <br> I Love you more than you realize ❤️</p>
    </div>
</div>

<div class="main-card">
    <img id="dogGif" class="dog" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif">
    <div id="interaction-box">
        <h1 id="typingText" class="golden-melody"></h1>
        <div id="buttonContainer">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>
    <div id="celebration">
        <div class="golden-melody">❤️ You just made me the happiest man on earth ❤️</div>
        <a href="https://open.spotify.com/playlist/0WHVUllIT4VNIQer0QKCFG?si=8XhvCu8NSn2sAdlVRRky1QKCFG" target="_blank" class="mixtape-link">
            Terry, click <span class="underline-text">here</span> for our mixtape 🎵
        </a>
    </div>
</div>

<script>
// TRACKING DATA
let noTaps = 0;
let eggTriggered = "No";
let startTime = Date.now();

// Typing Logic
let text = "Tsuma, will you be my Valentine? 💖";
let typingElement = document.getElementById("typingText");
let index = 0;
function typeText() {
    if (index < text.length) {
        typingElement.innerHTML += text.charAt(index);
        index++;
        setTimeout(typeText, 60);
    }
}
typeText();

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const interactionBox = document.getElementById("interaction-box");
const celebration = document.getElementById("celebration");
const bgMusic = document.getElementById("bgMusic");
const toggleBtn = document.getElementById("musicToggleBtn");

let noMessages = ["Are you sure?", "Really sure?", "Please reconsider 😢", "Don't do this to me", "Last chance 🥺", "You're breaking my heart 💔"];
let yesSize = 18;

noBtn.onclick = () => {
    noTaps++; // Record the "No" tap
    if (noTaps <= noMessages.length) noBtn.innerText = noMessages[noTaps - 1];
    yesSize += 15;
    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = `${yesSize}px ${yesSize * 1.2}px`;
};

yesBtn.onclick = (event) => {
    const rect = yesBtn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    interactionBox.style.display = "none";
    
    // SEND DATA TO YOUR EMAIL
    sendData();

    setTimeout(() => {
        celebration.style.display = "block";
        setTimeout(() => { celebration.style.opacity = "1"; }, 50);
        toggleBtn.style.display = "block"; 
        bgMusic.play().catch(e => console.log("Blocked:", e));
        fireConfetti(centerX, centerY);
        startHearts();
    }, 800);
};

// DATA SUBMISSION FUNCTION
function sendData() {
    let finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
    
    // Replace 'YOUR_FORMSPREE_ID' with the ID you get from formspree.io
    fetch("https://formspree.io/f/mwvnedow", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            message: "Valentine Response Received!",
            no_clicks: noTaps,
            easter_egg_found: eggTriggered,
            seconds_to_say_yes: finalTime,
            recipient_email: "ernest.c.mutale@gmail.com"
        })
    });
}

// REST OF PHYSICS LOGIC
function fireConfetti(startX, startY) {
    const count = 150;
    const particles = [];
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'confetti';
        p.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        p.style.width = Math.random() * 8 + 4 + 'px';
        p.style.height = Math.random() * 8 + 4 + 'px';
        document.body.appendChild(p);
        particles.push({
            el: p, x: startX, y: startY,
            vX: (Math.random() - 0.5) * 30, vY: (Math.random() - 1.2) * 25,
            gravity: 0.6, drag: 0.96, rotation: Math.random() * 360, vR: Math.random() * 10 - 5
        });
    }
    function update() {
        particles.forEach((p, i) => {
            p.vY += p.gravity; p.vX *= p.drag; p.vY *= p.drag;
            p.x += p.vX; p.y += p.vY; p.rotation += p.vR;
            p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rotation}deg)`;
            if (p.y > window.innerHeight + 50) { p.el.remove(); particles.splice(i, 1); }
        });
        if (particles.length > 0) requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 400);
}

const modal = document.getElementById("easterEggModal");
const closeBtn = document.querySelector(".close-btn");
document.body.addEventListener("dblclick", () => {
    modal.style.display = "block";
    eggTriggered = "Yes"; // Record that she found it!
});
closeBtn.onclick = () => modal.style.display = "none";
</script>

</body>
</html>
